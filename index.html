<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Blog sobre filmes</title>
        <style>
            header {
                background-color: #CBE4FF;
                color: #000000;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid #000000;
            }
            main {
                background-color: #000000;
                color: #CBE4FF;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
                gap: 16px;
                align-items: center;
            }
            img {
                width: 80px;
                height: 80px;

            }
            .artigo-autor {
                font-weight: bold;
            }

        </style>
    </head>

    <body>
        <header>
            <h1>Meu blog sobre cinema</h1>
            <p>Vou compartilhar curiosidades sobre o cinema</p>
        </header>
        <main>
             
             <img src="imagem-blog.png" alt="Ícone quadrado com uma claquete de cinema com a palavra 'BLOG CINEMA', um rolo de filme e um projetor retrô em fundo azul.">
             <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Arthur Rodrigues</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar conhecimentos sobre filmes e informação sobre cinema.</p>
                <button>👍 <span>0</span>0</button>
            </div>

     </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++; 
    }

</script>
</html>
